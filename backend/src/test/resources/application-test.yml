spring:
  datasource:
    url: jdbc:h2:mem:kfokam48;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

app:
  presence:
    duree-validite-code-minutes: 15
    max-tentatives-echouees: 5
    duree-blocage-minutes: 2
